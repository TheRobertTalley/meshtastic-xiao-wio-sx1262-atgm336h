[native_base]
extends = portduino_base
build_flags = ${portduino_base.build_flags} -I variants/native/portduino
  -I /usr/include
board = cross_platform
board_level = extra
lib_deps = 
  ${portduino_base.lib_deps}
  # renovate: datasource=custom.pio depName=Melopero RV3028 packageName=melopero/library/Melopero RV3028
  melopero/Melopero RV3028@1.2.0

build_src_filter = ${portduino_base.build_src_filter}

[env:native]
extends = native_base
; The helper below optionally adds link flags and succeeds when a package or
; pkg-config itself is unavailable. This works in both Windows and POSIX shells.
build_flags = ${native_base.build_flags}
  !python bin/optional-pkg-config.py --libs libulfius --silence-errors
  !python bin/optional-pkg-config.py --libs openssl --silence-errors
  !python bin/optional-pkg-config.py --cflags --libs sdl2 --silence-errors
  !python bin/optional-pkg-config.py --cflags --libs libbsd-overlay --silence-errors

; Minimal cross-platform host environment for hardware-independent XIAO parser
; tests. It intentionally excludes Portduino, graphics, and Linux-only headers.
[env:native-xiao-parser]
platform = native
test_framework = unity
extra_scripts =
lib_deps =
build_flags =
  -std=gnu++17
  -Isrc
  -DTSV_PARSER_ONLY_NATIVE
build_src_filter =
  +<modules/XiaoLd2410Parser.cpp>

[env:native-tft]
extends = native_base
build_type = release
lib_deps =
  ${native_base.lib_deps}
  ${device-ui_base.lib_deps}
build_flags = ${native_base.build_flags} -Os -lX11 -linput -lxkbcommon -ffunction-sections -fdata-sections -Wl,--gc-sections
  -D RAM_SIZE=16384
  -D USE_X11=1
  -D HAS_TFT=1
  -D HAS_SCREEN=1
  -D LV_CACHE_DEF_SIZE=6291456
  -D LV_BUILD_TEST=0
  -D LV_USE_LIBINPUT=1
  -D LV_LVGL_H_INCLUDE_SIMPLE
  -D LV_CONF_INCLUDE_SIMPLE
  -D LV_COMP_CONF_INCLUDE_SIMPLE
  -D USE_LOG_DEBUG
  -D LOG_DEBUG_INC=\"DebugConfiguration.h\"
  -D USE_PACKET_API
  -D VIEW_320x240
  !python bin/optional-pkg-config.py --libs libulfius --silence-errors
  !python bin/optional-pkg-config.py --libs openssl --silence-errors
  !python bin/optional-pkg-config.py --cflags --libs sdl2 --silence-errors
  !python bin/optional-pkg-config.py --cflags --libs libbsd-overlay --silence-errors
build_src_filter =
  ${native_base.build_src_filter}

[env:native-fb]
extends = native_base
build_type = release
lib_deps =
  ${native_base.lib_deps}
  ${device-ui_base.lib_deps}
build_flags = ${native_base.build_flags} -Os -ffunction-sections -fdata-sections -Wl,--gc-sections
  -D RAM_SIZE=8192
  -D USE_FRAMEBUFFER=1
  -D LV_COLOR_DEPTH=32
  -D HAS_TFT=1
  -D HAS_SCREEN=1
  -D LV_BUILD_TEST=0
  -D LV_USE_LOG=0
  -D LV_USE_EVDEV=1
  -D LV_LVGL_H_INCLUDE_SIMPLE
  -D LV_CONF_INCLUDE_SIMPLE
  -D LV_COMP_CONF_INCLUDE_SIMPLE
  -D USE_LOG_DEBUG
  -D LOG_DEBUG_INC=\"DebugConfiguration.h\"
  -D USE_PACKET_API
  -D VIEW_320x240
  -D MAP_FULL_REDRAW
  !python bin/optional-pkg-config.py --libs libulfius --silence-errors
  !python bin/optional-pkg-config.py --libs openssl --silence-errors
  !python bin/optional-pkg-config.py --cflags --libs libbsd-overlay --silence-errors
build_src_filter =
  ${native_base.build_src_filter}

[env:native-tft-debug]
extends = native_base
build_type = debug
lib_deps =
  ${native_base.lib_deps}
  ${device-ui_base.lib_deps}
build_flags = ${native_base.build_flags} -O0 -fsanitize=address -lX11 -linput -lxkbcommon
  -D DEBUG_HEAP
  -D RAM_SIZE=16384
  -D USE_X11=1
  -D HAS_TFT=1
  -D HAS_SCREEN=0
  -D LV_CACHE_DEF_SIZE=6291456
  -D LV_BUILD_TEST=0
  -D LV_USE_LOG=1
  -D LV_USE_SYSMON=1
  -D LV_USE_PERF_MONITOR=1
  -D LV_USE_MEM_MONITOR=0
  -D LV_USE_PROFILER=0
  -D LV_USE_LIBINPUT=1
  -D LV_LVGL_H_INCLUDE_SIMPLE
  -D LV_CONF_INCLUDE_SIMPLE
  -D LV_COMP_CONF_INCLUDE_SIMPLE
  -D USE_LOG_DEBUG
  -D LOG_DEBUG_INC=\"DebugConfiguration.h\"
  -D USE_PACKET_API
  -D VIEW_320x240
  !python bin/optional-pkg-config.py --libs libulfius --silence-errors
  !python bin/optional-pkg-config.py --libs openssl --silence-errors
  !python bin/optional-pkg-config.py --cflags --libs libbsd-overlay --silence-errors
build_src_filter = ${env:native-tft.build_src_filter}

[env:coverage]
extends = env:native
build_flags = -lgcov --coverage -fprofile-abs-path -fsanitize=address ${env:native.build_flags}
; https://docs.platformio.org/en/latest/projectconf/sections/env/options/test/test_testing_command.html
test_testing_command =
  ${platformio.build_dir}/${this.__env__}/meshtasticd
  -s
